# Configuración del backend de Firebase App Hosting.
# https://firebase.google.com/docs/app-hosting/configure
#
# La config web de Firebase (apiKey, projectId, …) la inyecta App Hosting en el build
# (FIREBASE_WEBAPP_CONFIG), así que no hace falta declararla acá. La lee lib/firebase/build-config.mjs.
# Los secretos, si aparecen, van con `firebase apphosting:secrets:set` y se referencian con `secret:`.

runConfig:
  # Constitución III: costo cero en reposo y techo de instancias.
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://amigoinvisible.com.ar
    availability:
      - BUILD
      - RUNTIME

  # Login con Google en el mismo dominio que la app (research R6 de la 001): el SDK usa
  # amigoinvisible.com.ar como authDomain y next.config.mjs hace proxy de /__/auth/* hacia
  # <proyecto>.firebaseapp.com. Requiere el redirect URI https://amigoinvisible.com.ar/__/auth/handler
  # en el cliente OAuth web de Google (T056). Solo host, sin https://.
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: amigoinvisible.com.ar
    availability:
      - BUILD

  # Mails transaccionales (feature 002, US6) con Resend.
  - variable: EMAIL_FROM
    value: "Amigo Invisible <no-responder@avisos.amigoinvisible.com.ar>"
    availability:
      - RUNTIME
  # El secreto tiene que existir ANTES del deploy, si no el rollout falla:
  #   firebase apphosting:secrets:set RESEND_API_KEY --project amigue-invisible-604df
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
